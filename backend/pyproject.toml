[project]
name = "tfr-backend"
version = "0.1.0"
description = "Backend API and agent runtime for the Targeted File Review assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "mlflow>=3.12.0",
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.24",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "gepadantic",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gepadantic = { git = "https://github.com/pdoubleg/gepadantic.git" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
